version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: bestkids_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bestkids_db
      POSTGRES_USER: bestkids_user
      POSTGRES_PASSWORD: bestkids_password_2024
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - bestkids_network

  # Redis (opcional, para caching)
  redis:
    image: redis:7-alpine
    container_name: bestkids_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bestkids_network

  # pgAdmin (opcional, para gestión de BD)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bestkids_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bestkids.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - bestkids_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bestkids_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=bestkids_user
      - DATABASE_PASSWORD=bestkids_password_2024
      - DATABASE_NAME=bestkids_db
      - JWT_SECRET=super-secret-key-change-in-production
    depends_on:
      - postgres
    networks:
      - bestkids_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:3001/api
    container_name: bestkids_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api
    depends_on:
      - backend
    networks:
      - bestkids_network

volumes:
  postgres_data:
  redis_data:


networks:
  bestkids_network:
    driver: bridge
