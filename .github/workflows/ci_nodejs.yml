name: BestKids Node.js CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json

    # Build Verification
    - name: Install Dependencies
      run: npm ci
      working-directory: ./frontend 
      # Assuming we are running this AFTER moving to root, but wait. 
      # IF this file is inside 'nuevo-proyecto' now, and we move it to root later.
      # The paths in the repo will be root-based.
      # If we consolidate frontend/backend into root, or keep them as subfolders?
      # Structure is 'nuevo-proyecto/frontend' and 'nuevo-proyecto/backend'.
      # After move: 'frontend/' and 'backend/'.

    - name: Build Frontend
      run: |
        cd frontend
        npm run build

    - name: Build Backend
      run: |
        cd backend
        npm ci
        npm run build

    # Deploy Step
    - name: Deploy to Production
      if: success()
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd /opt/bestkids-game
          git pull
          # Rebuild Docker Containers
          docker-compose -f docker-compose.prod.yml up -d --build --remove-orphans
          # Prune old images to save space
          docker image prune -f
